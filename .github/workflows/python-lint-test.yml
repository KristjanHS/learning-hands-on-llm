# CI: ruff lint/format check + pytest via uv
# Replaces legacy black+flake8 pipeline (Task 2.4)
name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ruff-action bundles its own ruff binary — no setup-uv needed here
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.10"  # = .pre-commit-config.yaml rev + uv.lock
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.10"  # = .pre-commit-config.yaml rev + uv.lock
          args: "format --check"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"  # torch 2.7.1 has no cp314 wheel
      - run: uv sync
      - run: uv run pytest --tb=short
